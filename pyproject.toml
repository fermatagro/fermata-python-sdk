[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fermata"
version = "0.1.0"
description = "Python SDK for Fermata On-Site (Hera API)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.2",
    "uuid-utils>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.14",
    "mypy>=1.10",
    "openapi-python-client>=0.28",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fermata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
