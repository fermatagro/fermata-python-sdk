openapi: 3.0.0
info:
  title: Demetra AI Vision API
  version: 0.0.0
tags:
  - name: Predictions
  - name: Inference
  - name: Reports
  - name: Media
  - name: CoveredArea
  - name: AffectedArea
  - name: TotalAffectedArea
  - name: Heatmap
  - name: Threshold Presets
paths:
  /api/v1/affected-area/{cycleId}:
    get:
      operationId: fetchAffectedArea
      description: Fetch affected area
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
        - name: classes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: timeBucket
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Models.TimeBucket'
          explode: false
        - name: ignoreThreshold
          in: query
          required: false
          description: When true, disables filtering predictions by presaved thresholds
          schema:
            type: boolean
          explode: false
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmax'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymax'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Models.AffectedArea'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - AffectedArea
      security:
        - BearerAuth: []
  /api/v1/covered-area/{cycleId}:
    get:
      operationId: fetchCoveredArea
      description: Fetch covered area
      parameters:
        - name: cycleId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
        - name: timeBucket
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Models.TimeBucket'
          explode: false
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
