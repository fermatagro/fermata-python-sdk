  /api/v1/predictions:
    get:
      operationId: listPredictions
      description: Query predictions with filters
      parameters:
        - name: cycleId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: classes
          in: query
          required: false
          description: Class identifiers from ML API (class names)
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: photoId
          in: query
          required: false
          description: Filter predictions by photo ID
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: pipelineId
          in: query
          required: false
          description: Filter predictions by pipeline ID
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: includeHidden
          in: query
          required: false
          description: Include hidden predictions in the result
          schema:
            type: boolean
          explode: false
        - name: includeEmpty
          in: query
          required: false
          description: Include predictions with empty class (i.e., 'undefined')
          schema:
            type: boolean
          explode: false
        - name: ignoreThreshold
          in: query
          required: false
          description: When true, disables filtering predictions by presaved thresholds
          schema:
            type: boolean
          explode: false
        - name: capturedFrom
          in: query
          required: false
          description: Filter by photo capture time (start, inclusive)
          schema:
            type: string
            format: date-time
          explode: false
        - name: capturedTo
          in: query
          required: false
          description: Filter by photo capture time (end, exclusive)
          schema:
            type: string
            format: date-time
          explode: false
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmax'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymax'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Prediction'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Predictions
      security:
        - BearerAuth: []
