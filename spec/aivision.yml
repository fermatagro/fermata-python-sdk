components:
  parameters:
    Common.Pagination.PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Token to retrieve items after a specific point
      schema:
        type: string
      explode: false
    Common.Pagination.PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (server may return fewer)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      explode: false
    Common.Types.GridRectQuery.xmax:
      name: xmax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.xmin:
      name: xmin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymax:
      name: ymax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymin:
      name: ymin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridZoomQuery:
      name: zoom
      in: query
      required: false
      schema:
        type: integer
        format: int8
      explode: false
    Common.Types.TimeRangeQuery.from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Common.Types.TimeRangeQuery.to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
        - request_id
        - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - AuthenticationRequired
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ConflictError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Conflict
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the resource already exists or conflicts with the current state
    Common.Errors.ForbiddenError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Forbidden
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - InternalServerError
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
        - code
        - resource_id
      properties:
        code:
          type: string
          enum:
            - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Errors.ValidationError:
      type: object
      required:
        - code
        - details
      properties:
        code:
          type: string
          enum:
            - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
              - field
              - issue
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the request was invalid
    Common.Types.GridPos:
      type: object
      required:
        - x
        - 'y'
        - h
      properties:
        x:
          type: number
          format: double
        'y':
          type: number
          format: double
        h:
          type: number
          format: double
      description: Position in 3D grid space within the greenhouse
    Common.Types.GridRect:
      type: object
      required:
        - x1
        - y1
        - x2
        - y2
      properties:
        x1:
          type: number
          format: double
        y1:
          type: number
          format: double
        x2:
          type: number
          format: double
        y2:
          type: number
          format: double
      description: Rectangular area on the greenhouse grid
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Common.Types.OrganizationID:
      type: string
      description: Organization identifier (opaque string)
    Common.Types.PTZ:
      type: object
      required:
        - pan
        - tilt
        - zoom
      properties:
        pan:
          type: number
          format: double
          description: Pan angle in radians (-π to π)
        tilt:
          type: number
          format: double
          description: Tilt angle in radians (0 to π/2)
        zoom:
          type: number
          format: double
          description: Zoom level (camera-specific, e.g., 1-25)
      description: Pan-Tilt-Zoom camera position. Pan and tilt are in radians.
    Common.Types.TimeRange:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      description: Time range with start and end timestamps
    CreateOrUpdateReport:
      type: object
      required:
        - greenhouseId
        - kind
        - title
        - from
        - to
        - printUrl
      properties:
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        kind:
          $ref: '#/components/schemas/Models.ReportKind'
        title:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        printUrl:
          type: string
          format: uri
          description: Full URL for Gotenberg to render the PDF (e.g., https://admin.example.com/reports/{id}/pdf)
      description: ''
    CreateOrUpdateThresholdPreset:
      type: object
      required:
        - level
        - externalId
        - modelName
        - presetType
        - name
        - values
      properties:
        level:
          $ref: '#/components/schemas/Models.PresetLevel'
        externalId:
          type: string
          description: 'Scoping key: model_name for model-level, org_id for organization, gc_id for gc'
        modelName:
          type: string
        presetType:
          $ref: '#/components/schemas/Models.PresetType'
        name:
          type: string
        values:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Map of class name to confidence threshold (0..1)
      description: ''
    Models.AffectedArea:
      type: object
      required:
        - range
        - classes
      properties:
        range:
          $ref: '#/components/schemas/Common.Types.TimeRange'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Models.AffectingClass'
          description: Class codes
    Models.AffectingClass:
      type: object
      required:
        - class
        - value
        - detectionCount
        - boxCount
      properties:
        class:
          type: string
          description: Class code
        value:
          type: integer
          description: Affected area, in 1x1sqm cells
        detectionCount:
          type: integer
          description: Total number of detections for this class in this time bucket
        boxCount:
          type: integer
          description: Total number of prediction boxes for this class in this time bucket
    Models.CoveredArea:
      type: object
      required:
        - range
        - value
      properties:
        range:
          $ref: '#/components/schemas/Common.Types.TimeRange'
        value:
          type: integer
          description: Covered area, in 1x1sqm cells
    Models.HidePredictionsRequest:
      type: object
      required:
        - predictionIds
      properties:
        predictionIds:
          type: array
          items:
            $ref: '#/components/schemas/Common.Types.ID'
          description: List of prediction IDs to hide
      description: Request to hide predictions
    Models.InferenceRequest:
      type: object
      required:
        - photoId
        - modelName
      properties:
        photoId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Photo ID to run inference on
        modelName:
          type: string
          description: ML model name to use for inference
      description: Request to submit an inference task
    Models.InferenceResponse:
      type: object
      required:
        - taskId
      properties:
        taskId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Task ID (UUID) for tracking the inference
      description: Response after submitting an inference task
    Models.InferenceTaskPayload:
      type: object
      required:
        - photoId
        - modelName
        - stage
      properties:
        photoId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Photo ID being processed
        modelName:
          type: string
          description: ML model name used for inference
        stage:
          type: string
          description: Current processing stage
      description: Payload information for inference tasks
    Models.PrecomputedPrediction:
      type: object
      properties:
        classId:
          type: string
          description: Detection class name from the external model
        confidence:
          type: number
          format: float
          description: Confidence score (0-1)
        bbox:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Bounding box in normalized coordinates
      description: A single pre-computed prediction from an external model
    Models.Prediction:
      type: object
      required:
        - id
        - greenhouseId
        - photoId
        - modelName
        - modelThreshold
        - cultureId
        - capturedAt
        - predictedAt
        - plantingDate
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        greenhouseId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        pos:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridPos'
          readOnly: true
        ptz:
          allOf:
            - $ref: '#/components/schemas/Common.Types.PTZ'
          readOnly: true
        photoId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        modelName:
          type: string
          readOnly: true
        modelThreshold:
          type: number
          format: float
          nullable: true
          readOnly: true
        cultureId:
          type: string
          readOnly: true
        classId:
          type: string
          description: Class identifier from ML API (class name)
          readOnly: true
        confidence:
          type: number
          format: float
          readOnly: true
        bbox:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          readOnly: true
        polygon:
          type: array
          items:
            $ref: '#/components/schemas/Models.Vertex'
          readOnly: true
        capturedAt:
          type: string
          format: date-time
          readOnly: true
        predictedAt:
          type: string
          format: date-time
          readOnly: true
        plantingDate:
          type: string
          format: date-time
          readOnly: true
        hidden:
          type: boolean
          description: Whether the prediction is hidden from normal view
          readOnly: true
    Models.PredictionCount:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
    Models.PredictionHeatmap:
      type: object
      required:
        - timeRange
        - boxes
      properties:
        timeRange:
          type: string
          format: date-time
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/Models.PredictionHeatmapRect'
    Models.PredictionHeatmapClass:
      type: object
      required:
        - class
        - count
      properties:
        class:
          type: string
        count:
          type: integer
          format: int32
    Models.PredictionHeatmapRect:
      type: object
      required:
        - rect
        - predictions
      properties:
        rect:
          $ref: '#/components/schemas/Common.Types.GridRect'
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Models.PredictionHeatmapClass'
    Models.PredictionQuery:
      type: object
      required:
        - range
      properties:
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        pos:
          $ref: '#/components/schemas/Common.Types.GridPos'
        classId:
          type: string
          description: Class identifier from ML API (class name)
        range:
          $ref: '#/components/schemas/Common.Types.TimeRange'
      description: Query parameters for filtering predictions
    Models.PresetLevel:
      type: string
      enum:
        - model
        - organization
        - gc
      description: Hierarchy level of a threshold preset
    Models.PresetType:
      type: string
      enum:
        - balance
        - precision
        - recall
        - experimental
      description: Preset category
    Models.Report:
      type: object
      required:
        - id
        - greenhouseId
        - kind
        - title
        - from
        - to
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        kind:
          $ref: '#/components/schemas/Models.ReportKind'
        title:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
          readOnly: true
        readyAt:
          type: string
          format: date-time
          readOnly: true
        downloadUrl:
          type: string
          format: uri
          description: Presigned URL to download the report PDF (available when report is ready)
          readOnly: true
    Models.ReportKind:
      type: string
      enum:
        - daily
        - weekly
        - custom
        - wrapped
      description: Type of AI vision report
    Models.SetPresetNameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
      description: Request to set a preset name
    Models.Task:
      type: object
      required:
        - id
        - status
        - type
        - attempts
        - runAt
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Task ID (UUID)
        status:
          allOf:
            - $ref: '#/components/schemas/Models.TaskStatus'
          description: Current status of the task
        type:
          type: string
          description: Type of the task (e.g., 'aivision:inference')
        attempts:
          type: integer
          format: int32
          description: Number of processing attempts
        runAt:
          type: string
          format: date-time
          description: Scheduled run time
        createdAt:
          type: string
          format: date-time
          description: Task creation time
        modifiedAt:
          type: string
          format: date-time
          description: Last modification time
        errorReason:
          type: string
          description: Error reason if task failed
        payload:
          allOf:
            - $ref: '#/components/schemas/Models.InferenceTaskPayload'
          description: Task-specific payload information
      description: A task in the processing queue
    Models.TaskStatus:
      type: string
      enum:
        - pending
        - processing
        - done
        - failed
        - canceled
      description: Status of a task in the processing queue
    Models.ThresholdPreset:
      type: object
      required:
        - id
        - level
        - externalId
        - modelName
        - presetType
        - selected
        - name
        - values
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        ownerOrganizationId:
          type: string
          description: Owner organization ID. Null for model-level (system) presets.
          readOnly: true
        level:
          $ref: '#/components/schemas/Models.PresetLevel'
        externalId:
          type: string
          description: 'Scoping key: model_name for model-level, org_id for organization, gc_id for gc'
        modelName:
          type: string
        presetType:
          $ref: '#/components/schemas/Models.PresetType'
        selected:
          type: boolean
          readOnly: true
        name:
          type: string
        values:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Map of class name to confidence threshold (0..1)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A threshold preset with per-class confidence thresholds for a model
    Models.TimeBucket:
      type: string
      enum:
        - day
        - week
      description: Aggregation period time
    Models.UnhidePredictionsRequest:
      type: object
      required:
        - predictionIds
      properties:
        predictionIds:
          type: array
          items:
            $ref: '#/components/schemas/Common.Types.ID'
          description: List of prediction IDs to unhide
      description: Request to unhide predictions
    Models.UpdatePresetValuesRequest:
      type: object
      required:
        - values
      properties:
        values:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Map of class name to confidence threshold (0..1)
      description: Request to replace all threshold values
    Models.UploadPredictionsRequest:
      type: object
      required:
        - photoId
        - modelName
      properties:
        photoId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Photo ID to attach predictions to
        modelName:
          type: string
          description: ML model name that produced the predictions
        predictions:
          type: array
          items:
            $ref: '#/components/schemas/Models.PrecomputedPrediction'
          description: Pre-computed predictions to store
        predictedAt:
          type: string
          format: date-time
          description: Timestamp when predictions were generated. Defaults to current time if omitted.
      description: Request to upload pre-computed predictions for a photo
    Models.Vertex:
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          type: number
          format: double
          readOnly: true
        'y':
          type: number
          format: double
          readOnly: true
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://api.croptimus.com
    description: prod
    variables: {}
  - url: https://api.fermata.click
    description: dev
    variables: {}
  - url: http://localhost:3000
    description: local
    variables: {}
