openapi: 3.0.0
info:
  title: Demetra AI Vision API
  version: 1.1.0
tags:
- name: PredictionsAPI
- name: InferenceAPI
- name: InferenceStreamAPI
- name: ReportsAPI
- name: MediaStaticAPI
- name: CoveredAreaAPI
- name: AffectedAreaAPI
- name: TotalAffectedAreaAPI
- name: HeatmapAPI
- name: PresetsAPI
paths:
  /api/v1/inference:
    post:
      operationId: submitInference
      description: Submit an inference task for a photo
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing
            has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.InferenceResponse'
        '400':
          description: The server could not understand the request due to invalid
            syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - InferenceAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.InferenceRequest'
      security:
      - BearerAuth: []
  /api/v1/inference/task/{taskId}:
    get:
      operationId: getInferenceTask
      description: Get the status of an inference task by ID
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Task'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - InferenceAPI
      security:
      - BearerAuth: []
components:
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
      - request_id
      - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - AuthenticationRequired
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ForbiddenError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - Forbidden
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - InternalServerError
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
      - code
      - resource_id
      properties:
        code:
          type: string
          enum:
          - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Errors.ValidationError:
      type: object
      required:
      - code
      - details
      properties:
        code:
          type: string
          enum:
          - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
            - field
            - issue
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the request was invalid
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Models.InferenceRequest:
      type: object
      required:
      - photoId
      - modelName
      properties:
        photoId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Photo ID to run inference on
        modelName:
          type: string
          description: ML model name to use for inference
      description: Request to submit an inference task
    Models.InferenceResponse:
      type: object
      required:
      - taskId
      properties:
        taskId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Task ID (UUID) for tracking the inference
      description: Response after submitting an inference task
    Models.InferenceTaskPayload:
      type: object
      required:
      - photoId
      - modelName
      - stage
      properties:
        photoId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Photo ID being processed
        modelName:
          type: string
          description: ML model name used for inference
        stage:
          type: string
          description: Current processing stage
      description: Payload information for inference tasks
    Models.Task:
      type: object
      required:
      - id
      - status
      - type
      - attempts
      - runAt
      - createdAt
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Task ID (UUID)
        status:
          allOf:
          - $ref: '#/components/schemas/Models.TaskStatus'
          description: Current status of the task
        type:
          type: string
          description: Type of the task (e.g., 'aivision:inference')
        attempts:
          type: integer
          format: int32
          description: Number of processing attempts
        runAt:
          type: string
          format: date-time
          description: Scheduled run time
        createdAt:
          type: string
          format: date-time
          description: Task creation time
        modifiedAt:
          type: string
          format: date-time
          description: Last modification time
        errorReason:
          type: string
          description: Error reason if task failed
        payload:
          allOf:
          - $ref: '#/components/schemas/Models.InferenceTaskPayload'
          description: Task-specific payload information
      description: A task in the processing queue
    Models.TaskStatus:
      type: string
      enum:
      - pending
      - processing
      - done
      - failed
      - canceled
      description: Status of a task in the processing queue
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
