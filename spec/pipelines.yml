openapi: 3.0.0
info:
  title: Demetra Pipelines API
  version: 0.0.0
tags:
  - name: Templates
  - name: Schedules
  - name: Fires
paths:
  /api/v1/pipelines/fires:
    get:
      operationId: listFires
      description: |-
        List fires with optional filtering.

        Supports filtering by template, trigger, status, and time window.
        Time filters apply to scheduledAt field.
      parameters:
        - name: pipelineTemplateId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: triggerType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.TriggerType'
          explode: false
        - name: triggerId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: scope
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.ScheduleScope'
          explode: false
        - name: scopeId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.FireStatus'
          explode: false
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Fire'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Fires
      security:
        - BearerAuth: []
  /api/v1/pipelines/fires/generate:
    post:
      operationId: generateFires
      description: |-
        Generate missing schedule-triggered fires.

        Scheduler/system operation that creates Fire records for all enabled schedules
        up to the current time.

        Idempotent via deduplicationKey uniqueness - if a fire already exists for a
        given schedule+scheduledAt combination, it is counted as skipped.

        Returns counts of created/skipped fires.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.GenerateFiresResult'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Fires
      security:
        - BearerAuth: []
  /api/v1/pipelines/fires/{fireId}:
    get:
      operationId: getFire
      description: Get a specific fire by ID
      parameters:
        - name: fireId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Fire'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Fires
      security:
        - BearerAuth: []
    post:
      operationId: createFire
      description: |-
        Create a fire (request trigger).

        triggerType is implicitly "request" for this endpoint.
        Idempotent: if deduplicationKey already exists, returns existing Fire.
        Deduplication key format: "request:{triggerId}"
      parameters:
        - name: fireId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Fires
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateFire'
      security:
        - BearerAuth: []
