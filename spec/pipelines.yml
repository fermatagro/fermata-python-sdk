openapi: 3.0.0
info:
  title: Demetra Pipelines API
  version: 1.2.0
tags:
- name: TemplatesAPI
- name: SchedulesAPI
- name: FiresAPI
paths:
  /api/v1/pipelines/fires/{fireId}:
    post:
      operationId: createFire
      description: 'Create a fire (request trigger).


        triggerType is implicitly "request" for this endpoint.

        Idempotent: if deduplicationKey already exists, returns existing Fire.

        Deduplication key format: "request:{triggerId}"'
      parameters:
      - name: fireId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created
            as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - FiresAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateFire'
      security:
      - BearerAuth: []
  /api/v1/pipelines/fires/{fireId}/complete:
    post:
      operationId: completeFire
      description: 'Complete a fire with terminal status.


        Sets final status (completed|failed|cancelled|skipped) and finishedAt=now.

        errorMessage should be provided when status=failed.'
      parameters:
      - name: fireId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - FiresAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CompleteFireRequest'
      security:
      - BearerAuth: []
  /api/v1/pipelines/fires/{fireId}/start:
    post:
      operationId: startFire
      description: 'Start a fire.


        Transitions to running from pending, failed, cancelled, or running.

        Retry-safe on running->running: startedAt is preserved; externalRunId is overwritten
        with the value from the latest request.'
      parameters:
      - name: fireId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers
            may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - FiresAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.StartFireRequest'
      security:
      - BearerAuth: []
  /api/v1/pipelines/schedules:
    get:
      operationId: listSchedules
      description: List schedules with optional filtering
      parameters:
      - name: templateId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
        explode: false
      - name: scope
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Models.ScheduleScope'
        explode: false
      - name: scopeId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
        explode: false
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Models.ScheduleState'
        explode: false
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Models.ScheduleType'
        explode: false
      - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
      - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Schedule'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - SchedulesAPI
      security:
      - BearerAuth: []
  /api/v1/pipelines/schedules/{scheduleId}:
    get:
      operationId: getSchedule
      description: Get a specific schedule
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Schedule'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - SchedulesAPI
      security:
      - BearerAuth: []
components:
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
      - request_id
      - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - AuthenticationRequired
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ForbiddenError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - Forbidden
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - InternalServerError
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
      - code
      - resource_id
      properties:
        code:
          type: string
          enum:
          - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Common.Types.OrganizationID:
      type: string
      description: Organization identifier (opaque string)
    CreateOrUpdateFire:
      type: object
      required:
      - organizationId
      - triggerId
      - scope
      - scopeId
      - status
      properties:
        organizationId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this fire belongs to
        pipelineTemplateId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template. Optional — only set for
            schedule-triggered fires and mirrored onsite fires (whose schedule and
            template were synced from cloud beforehand). Request-triggered fires created
            directly via the API may omit it.
        triggerId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Trigger ID for deduplication (schedule_id for schedule, request/correlation
            ID for request)
        scope:
          allOf:
          - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        scopeId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        scheduledAt:
          type: string
          format: date-time
          description: When the pipeline is scheduled to run (defaults to server time
            if omitted)
        status:
          allOf:
          - $ref: '#/components/schemas/Models.FireStatus'
          description: Current execution status
        externalRunId:
          type: string
          description: Prefect flow_run_id, set at start (immutable once set)
        errorMessage:
          type: string
          description: Error message (present when status=failed or status=partial)
        arguments:
          type: object
          additionalProperties: {}
          description: Arguments passed to the pipeline execution
        startedAt:
          type: string
          format: date-time
          description: When execution actually started (status changed to running)
        finishedAt:
          type: string
          format: date-time
          description: When execution finished (terminal status reached)
      description: ''
    Models.CompleteFireRequest:
      type: object
      required:
      - status
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/Models.TerminalStatus'
          description: Final status
        errorMessage:
          type: string
          description: Error message (should be present when status=failed)
      description: Request to complete a fire with terminal status
    Models.FireStatus:
      type: string
      enum:
      - pending
      - running
      - completed
      - partial
      - failed
      - cancelled
      - skipped
      description: 'Current status of the fire.


        State transitions:

        - pending → running → completed|partial|failed

        - pending|running → cancelled|skipped

        - failed|cancelled → running (retry)'
    Models.Schedule:
      type: object
      required:
      - id
      - organizationId
      - templateId
      - scope
      - type
      - scopeId
      - state
      - cronExprUTC
      - arguments
      - createdAt
      - updatedAt
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this schedule belongs to
        templateId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template
        scope:
          allOf:
          - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        type:
          allOf:
          - $ref: '#/components/schemas/Models.ScheduleType'
          description: 'Schedule type: cloud or onsite'
        scopeId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        state:
          allOf:
          - $ref: '#/components/schemas/Models.ScheduleState'
          description: Whether the schedule is enabled or disabled
          readOnly: true
        startAt:
          type: string
          format: date-time
          description: When the schedule becomes active (optional)
        cronExprUTC:
          type: string
          description: Cron expression in UTC timezone
        arguments:
          type: object
          additionalProperties:
            type: string
          description: Arguments to pass to the pipeline
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A schedule that triggers pipeline execution on a cron basis
    Models.ScheduleScope:
      type: string
      enum:
      - greenhouse
      - growing_cycle
      description: Scope type for schedule binding
    Models.ScheduleState:
      type: string
      enum:
      - enabled
      - disabled
      description: Schedule state
    Models.ScheduleType:
      type: string
      enum:
      - cloud
      - onsite
      description: Schedule type indicating where the schedule is executed
    Models.StartFireRequest:
      type: object
      required:
      - externalRunId
      properties:
        externalRunId:
          type: string
          description: Prefect flow_run_id (immutable once set)
      description: Request to start a fire
    Models.TerminalStatus:
      type: string
      enum:
      - completed
      - partial
      - failed
      - cancelled
      - skipped
      description: Terminal status for completing a fire
  parameters:
    Common.Pagination.PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Token to retrieve items after a specific point
      schema:
        type: string
      explode: false
    Common.Pagination.PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (server may return fewer)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      explode: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
