components:
  parameters:
    Common.Pagination.PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Token to retrieve items after a specific point
      schema:
        type: string
      explode: false
    Common.Pagination.PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (server may return fewer)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      explode: false
    Common.Types.TimeRangeQuery.from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Common.Types.TimeRangeQuery.to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
        - request_id
        - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - AuthenticationRequired
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ConflictError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Conflict
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the resource already exists or conflicts with the current state
    Common.Errors.ForbiddenError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Forbidden
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - InternalServerError
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
        - code
        - resource_id
      properties:
        code:
          type: string
          enum:
            - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Errors.ValidationError:
      type: object
      required:
        - code
        - details
      properties:
        code:
          type: string
          enum:
            - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
              - field
              - issue
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the request was invalid
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Common.Types.OrganizationID:
      type: string
      description: Organization identifier (opaque string)
    CreateOrUpdateFire:
      type: object
      required:
        - organizationId
        - pipelineTemplateId
        - triggerId
        - scope
        - scopeId
        - status
      properties:
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this fire belongs to
        pipelineTemplateId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template
        triggerId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Trigger ID for deduplication (schedule_id for schedule, request/correlation ID for request)
        scope:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        scopeId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        scheduledAt:
          type: string
          format: date-time
          description: When the pipeline is scheduled to run (defaults to server time if omitted)
        status:
          allOf:
            - $ref: '#/components/schemas/Models.FireStatus'
          description: Current execution status
        externalRunId:
          type: string
          description: Prefect flow_run_id, set at start (immutable once set)
        errorMessage:
          type: string
          description: Error message (present when status=failed or status=partial)
        arguments:
          type: object
          additionalProperties: {}
          description: Arguments passed to the pipeline execution
        startedAt:
          type: string
          format: date-time
          description: When execution actually started (status changed to running)
        finishedAt:
          type: string
          format: date-time
          description: When execution finished (terminal status reached)
      description: ''
    CreateOrUpdateSchedule:
      type: object
      required:
        - organizationId
        - templateId
        - scope
        - type
        - scopeId
        - cronExprUTC
        - arguments
      properties:
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this schedule belongs to
        templateId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template
        scope:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        type:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleType'
          description: 'Schedule type: cloud or onsite'
        scopeId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        startAt:
          type: string
          format: date-time
          description: When the schedule becomes active (optional)
        cronExprUTC:
          type: string
          description: Cron expression in UTC timezone
        arguments:
          type: object
          additionalProperties:
            type: string
          description: Arguments to pass to the pipeline
      description: ''
    CreateOrUpdateTemplate:
      type: object
      required:
        - name
        - flowName
      properties:
        name:
          type: string
          description: Human-readable name for the pipeline
        flowName:
          type: string
          description: Prefect flow identifier (immutable after creation)
        description:
          type: string
          description: Description of what this pipeline does
        expectedArguments:
          type: array
          items:
            $ref: '#/components/schemas/Models.ExpectedArgument'
          description: Argument definitions describing what parameters this pipeline accepts
      description: ''
    Models.ArgumentType:
      type: string
      enum:
        - string
        - number
        - boolean
      description: Type of an expected argument value
    Models.CancelSkipRequest:
      type: object
      properties:
        reason:
          type: string
          description: Reason for cancellation or skip
      description: Optional reason for cancel/skip operations
    Models.CompleteFireRequest:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Models.TerminalStatus'
          description: Final status
        errorMessage:
          type: string
          description: Error message (should be present when status=failed)
      description: Request to complete a fire with terminal status
    Models.ExpectedArgument:
      type: object
      required:
        - name
        - type
        - required
      properties:
        name:
          type: string
          description: Argument name (key used when passing arguments to the pipeline)
        type:
          allOf:
            - $ref: '#/components/schemas/Models.ArgumentType'
          description: Expected value type
        required:
          type: boolean
          description: Whether this argument must be provided
        defaultValue:
          type: string
          description: Default value when argument is omitted (serialized as string)
        description:
          type: string
          description: Human-readable description of the argument's purpose
      description: Metadata describing an expected argument for a pipeline template
    Models.Fire:
      type: object
      required:
        - id
        - organizationId
        - pipelineTemplateId
        - triggerType
        - triggerId
        - scope
        - scopeId
        - deduplicationKey
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this fire belongs to
        pipelineTemplateId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template
        triggerType:
          allOf:
            - $ref: '#/components/schemas/Models.TriggerType'
          description: What triggered this fire
          readOnly: true
        triggerId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Trigger ID for deduplication (schedule_id for schedule, request/correlation ID for request)
        scope:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        scopeId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        scheduledAt:
          type: string
          format: date-time
          description: When the pipeline is scheduled to run (defaults to server time if omitted)
        deduplicationKey:
          type: string
          description: Unique key for deduplication (server-generated, see model docs for format)
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/Models.FireStatus'
          description: Current execution status
        externalRunId:
          type: string
          description: Prefect flow_run_id, set at start (immutable once set)
        errorMessage:
          type: string
          description: Error message (present when status=failed or status=partial)
        arguments:
          type: object
          additionalProperties: {}
          description: Arguments passed to the pipeline execution
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        startedAt:
          type: string
          format: date-time
          description: When execution actually started (status changed to running)
        finishedAt:
          type: string
          format: date-time
          description: When execution finished (terminal status reached)
      description: |-
        A Fire represents a single scheduled occurrence/execution instance for a pipeline template.

        Immutable planning fields: pipelineTemplateId, triggerType, triggerId, scheduledAt, deduplicationKey, arguments.
        Mutable execution fields: status, externalRunId, errorMessage, startedAt, finishedAt.

        Deduplication rules (unique constraint on deduplicationKey):
        - For triggerType="request": deduplicationKey = "request:{triggerId}"
        - For triggerType="schedule": deduplicationKey = "schedule:{triggerId}:{scheduledAtISO}"

        POST /fires is idempotent: if deduplicationKey exists, returns existing Fire.
    Models.FireStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - partial
        - failed
        - cancelled
        - skipped
      description: |-
        Current status of the fire.

        State transitions:
        - pending → running → completed|partial|failed
        - pending|running → cancelled|skipped
        - failed|cancelled → running (retry)
    Models.GenerateFiresResult:
      type: object
      required:
        - created
        - skipped
      properties:
        created:
          type: integer
          format: int32
          description: Number of fires created
        skipped:
          type: integer
          format: int32
          description: Number of fires skipped (already existed via deduplication)
      description: Response from generate fires operation
    Models.Schedule:
      type: object
      required:
        - id
        - organizationId
        - templateId
        - scope
        - type
        - scopeId
        - state
        - cronExprUTC
        - arguments
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization this schedule belongs to
        templateId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Reference to the pipeline template
        scope:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleScope'
          description: 'Scope type: greenhouse or growing cycle'
        type:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleType'
          description: 'Schedule type: cloud or onsite'
        scopeId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the scoped entity (greenhouse_id or growing_cycle_id)
        state:
          allOf:
            - $ref: '#/components/schemas/Models.ScheduleState'
          description: Whether the schedule is enabled or disabled
          readOnly: true
        startAt:
          type: string
          format: date-time
          description: When the schedule becomes active (optional)
        cronExprUTC:
          type: string
          description: Cron expression in UTC timezone
        arguments:
          type: object
          additionalProperties:
            type: string
          description: Arguments to pass to the pipeline
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A schedule that triggers pipeline execution on a cron basis
    Models.ScheduleScope:
      type: string
      enum:
        - greenhouse
        - growing_cycle
      description: Scope type for schedule binding
    Models.ScheduleState:
      type: string
      enum:
        - enabled
        - disabled
      description: Schedule state
    Models.ScheduleType:
      type: string
      enum:
        - cloud
        - onsite
      description: Schedule type indicating where the schedule is executed
    Models.StartFireRequest:
      type: object
      required:
        - externalRunId
      properties:
        externalRunId:
          type: string
          description: Prefect flow_run_id (immutable once set)
      description: Request to start a fire
    Models.Template:
      type: object
      required:
        - id
        - name
        - flowName
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        name:
          type: string
          description: Human-readable name for the pipeline
        flowName:
          type: string
          description: Prefect flow identifier (immutable after creation)
        description:
          type: string
          description: Description of what this pipeline does
        expectedArguments:
          type: array
          items:
            $ref: '#/components/schemas/Models.ExpectedArgument'
          description: Argument definitions describing what parameters this pipeline accepts
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A pipeline template representing a Prefect flow definition
    Models.TerminalStatus:
      type: string
      enum:
        - completed
        - partial
        - failed
        - cancelled
        - skipped
      description: Terminal status for completing a fire
    Models.TriggerType:
      type: string
      enum:
        - schedule
        - request
      description: What triggered the fire
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
