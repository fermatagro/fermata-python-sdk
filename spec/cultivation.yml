components:
  parameters:
    Common.Pagination.PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Token to retrieve items after a specific point
      schema:
        type: string
      explode: false
    Common.Pagination.PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (server may return fewer)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      explode: false
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
        - request_id
        - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - AuthenticationRequired
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ConflictError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Conflict
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the resource already exists or conflicts with the current state
    Common.Errors.ForbiddenError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Forbidden
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - InternalServerError
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
        - code
        - resource_id
      properties:
        code:
          type: string
          enum:
            - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Errors.ValidationError:
      type: object
      required:
        - code
        - details
      properties:
        code:
          type: string
          enum:
            - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
              - field
              - issue
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the request was invalid
    Common.Types.CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      format: currency-code
      description: Currency code (ISO 4217)
    Common.Types.GridRect:
      type: object
      required:
        - x1
        - y1
        - x2
        - y2
      properties:
        x1:
          type: number
          format: double
        y1:
          type: number
          format: double
        x2:
          type: number
          format: double
        y2:
          type: number
          format: double
      description: Rectangular area on the greenhouse grid
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Common.Types.OrganizationID:
      type: string
      description: Organization identifier (opaque string)
    Common.Types.UserID:
      type: string
      description: User identifier (opaque string)
    CreateOrUpdateCulture:
      type: object
      properties:
        description:
          type: string
      description: ''
    CreateOrUpdateGrowingCycle:
      type: object
      required:
        - description
        - greenhouseId
        - plantingDate
      properties:
        description:
          type: string
        currency:
          $ref: '#/components/schemas/Common.Types.CurrencyCode'
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cultureId:
          type: string
        plantingDate:
          type: string
          format: date-time
      description: ''
    CreateOrUpdateGrowingCycleRegion:
      type: object
      required:
        - rect
      properties:
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Rectangle defining the growing area
      description: ''
    CreateOrUpdateGrowingCycleRegionItem:
      type: object
      required:
        - rect
      properties:
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Rectangle defining the growing area
      description: ''
    CreateOrUpdateNote:
      type: object
      required:
        - growingCycleId
        - text
        - rect
      properties:
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        text:
          type: string
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Note area
      description: ''
    CreateOrUpdateTreatment:
      type: object
      required:
        - growingCycleId
        - treatmentTypeId
        - name
        - appliedAt
        - rect
      properties:
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        treatmentTypeId:
          type: string
        name:
          type: string
        appliedAt:
          type: string
          format: date-time
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Application area
        concentration:
          type: number
          format: double
          description: Concentration in g/l (grams per liter)
        appliedVolume:
          type: number
          format: double
          description: Applied volume in liters
        cost:
          type: number
          format: double
          description: Cost of the treatment
        currency:
          allOf:
            - $ref: '#/components/schemas/Common.Types.CurrencyCode'
          description: Currency code for the cost (e.g., USD, EUR)
        note:
          type: string
      description: ''
    CreateOrUpdateTreatmentType:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
      description: ''
    Models.Culture:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Unique identifier (e.g., 'tomato', 'cucumber')
          readOnly: true
        description:
          type: string
      description: A plant culture type (tomato, cucumber, etc.)
    Models.GrowingCycle:
      type: object
      required:
        - id
        - description
        - organizationId
        - greenhouseId
        - plantingDate
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        description:
          type: string
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          readOnly: true
        currency:
          $ref: '#/components/schemas/Common.Types.CurrencyCode'
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cultureId:
          type: string
        plantingDate:
          type: string
          format: date-time
        harvestDate:
          type: string
          format: date-time
          readOnly: true
      description: A growing cycle (planting to harvest) in a greenhouse
    Models.GrowingCycleRegion:
      type: object
      required:
        - id
        - growingCycleId
        - rect
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        growingCycleId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Rectangle defining the growing area
      description: A rectangular region within a growing cycle
    Models.Note:
      type: object
      required:
        - id
        - organizationId
        - growingCycleId
        - authorId
        - text
        - rect
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          readOnly: true
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        authorId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.UserID'
          readOnly: true
        text:
          type: string
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Note area
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A note attached to a location in a growing cycle
    Models.Treatment:
      type: object
      required:
        - id
        - organizationId
        - growingCycleId
        - treatmentTypeId
        - name
        - appliedAt
        - rect
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          readOnly: true
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        treatmentTypeId:
          type: string
        name:
          type: string
        appliedAt:
          type: string
          format: date-time
        rect:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridRect'
          description: Application area
        concentration:
          type: number
          format: double
          description: Concentration in g/l (grams per liter)
        appliedVolume:
          type: number
          format: double
          description: Applied volume in liters
        cost:
          type: number
          format: double
          description: Cost of the treatment
        currency:
          allOf:
            - $ref: '#/components/schemas/Common.Types.CurrencyCode'
          description: Currency code for the cost (e.g., USD, EUR)
        note:
          type: string
      description: A crop treatment applied to a growing cycle
    Models.TreatmentType:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique identifier (e.g., 'fertilizer', 'pesticide')
          readOnly: true
        name:
          type: string
        description:
          type: string
      description: A type of crop treatment (fertilizer, pesticide, watering, etc.)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
