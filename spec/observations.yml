      schema:
        type: integer
        format: int32
      explode: false
    Models.ListPanoramaRequest.deviceId:
      name: deviceId
      in: query
      required: false
      description: Filter by device ID
      schema:
        $ref: '#/components/schemas/Common.Types.ID'
      explode: false
    Models.ListPanoramaRequest.greenhouseId:
      name: greenhouseId
      in: query
