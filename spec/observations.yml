openapi: 3.0.0
info:
  title: Demetra Observations API
  version: 0.0.0
tags:
  - name: Photos
  - name: Panoramas
  - name: Media
  - name: MediaThumbnails
paths:
  /api/v1/panoramas:
    get:
      operationId: listPanoramas
      description: List panoramas with pagination
      parameters:
        - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - $ref: '#/components/parameters/Models.ListPanoramaRequest.greenhouseId'
        - $ref: '#/components/parameters/Models.ListPanoramaRequest.pipelineId'
        - $ref: '#/components/parameters/Models.ListPanoramaRequest.deviceId'
        - $ref: '#/components/parameters/Models.ListPanoramaRequest.baseX'
        - $ref: '#/components/parameters/Models.ListPanoramaRequest.baseY'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Panorama'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      security:
        - BearerAuth: []
  /api/v1/panoramas/cut:
    post:
      operationId: cutPanorama
      description: Submit a cut-only tile generation job for an existing panorama
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.CutPanoramaResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CutPanoramaRequest'
      security:
        - BearerAuth: []
  /api/v1/panoramas/stitch:
    post:
      operationId: submitPanoramaStitch
      description: Submit a panorama stitching task. Creates a Kharon ticket to process the stitch asynchronously.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.SubmitPanoramaStitchResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.SubmitPanoramaStitchRequest'
      security:
        - BearerAuth: []
  /api/v1/panoramas/stitch/upload-link:
    post:
      operationId: getRawCaptureUploadLink
      description: Get presigned upload URL for a single raw panorama input image
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.GetRawCaptureUploadLinkResponse'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ValidationError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ConflictError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.GetRawCaptureUploadLinkRequest'
      security:
        - BearerAuth: []
  /api/v1/panoramas/{panoramaId}:
    get:
      operationId: getPanorama
      description: Get panorama by ID. For M2M tokens, pass X-Organization-Id header.
      parameters:
        - name: panoramaId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Panorama'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      security:
        - BearerAuth: []
    delete:
      operationId: deletePanorama
      description: Delete panorama by ID. For M2M tokens, pass X-Organization-Id header.
      parameters:
        - name: panoramaId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Panoramas
      security:
        - BearerAuth: []
  /api/v1/photos:
    get:
      operationId: listPhotos
      description: List photos with filtering options
      parameters:
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - name: growingCycleId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: greenhouseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: deviceId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: zoneObjectId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.PhotoSource'
          explode: false
        - name: pipelineId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmax'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymax'
        - $ref: '#/components/parameters/Common.Types.HRangeQuery.hmin'
        - $ref: '#/components/parameters/Common.Types.HRangeQuery.hmax'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Photo'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      security:
        - BearerAuth: []
  /api/v1/photos/batch:
    get:
      operationId: getPhotoBatch
      description: Get a batch of photos by IDs
      parameters:
        - name: photoIds
          in: query
          required: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Common.Types.ID'
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.PhotoBatch'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      security:
        - BearerAuth: []
  /api/v1/photos/count:
    get:
      operationId: countPhotos
      description: Count photos matching filters
      parameters:
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.from'
        - $ref: '#/components/parameters/Common.Types.TimeRangeQuery.to'
        - name: growingCycleId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: greenhouseId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: deviceId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: zoneObjectId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Models.PhotoSource'
          explode: false
        - name: pipelineId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
          explode: false
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymin'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.xmax'
        - $ref: '#/components/parameters/Common.Types.GridRectQuery.ymax'
        - $ref: '#/components/parameters/Common.Types.HRangeQuery.hmin'
        - $ref: '#/components/parameters/Common.Types.HRangeQuery.hmax'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.PhotoCount'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      security:
        - BearerAuth: []
  /api/v1/photos/{photoId}:
    post:
      operationId: createPhoto
      description: Create photo metadata after S3 upload
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdatePhoto'
      security:
        - BearerAuth: []
    get:
      operationId: getPhoto
      description: Get photo information
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Photo'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      security:
        - BearerAuth: []
  /api/v1/photos/{photoId}/upload-link:
    post:
      operationId: createPhotoUploadLink
      description: Get a presigned URL for direct S3 upload
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.UploadLinkResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Photos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CreateUploadLink'
      security:
        - BearerAuth: []
  /cloudfront/{orgId}/thumb/{mediaType}/{year}/{month}/{day}/{mediaId}/{thumbCode}.{thumbExt}:
    get:
      operationId: getMediaThumb
      description: 'Get dynamic thumbnail ThumbCode format: w{width}h{height}dpr{dpr}q{quality}, e.g., w320h180dpr2q75.jpeg'
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.OrganizationID'
        - name: mediaType
          in: path
          required: true
          schema:
            type: string
        - name: year
          in: path
          required: true
          schema:
            type: integer
            format: int16
        - name: month
          in: path
          required: true
          schema:
            type: integer
            format: int8
        - name: day
          in: path
          required: true
          schema:
            type: integer
            format: int8
        - name: mediaId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
        - name: thumbCode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Models.ThumbCode'
        - name: thumbExt
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - MediaThumbnails
      security:
        - BearerAuth: []
  /media/panorama/{organizationId}/{panoramaId}:
    get:
      operationId: getMediaPanorama
      description: Get panorama media (redirects to S3 presigned URL)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.OrganizationID'
        - name: panoramaId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '307':
          description: The URL of the requested resource has been changed temporarily.
          headers:
            location:
              required: true
              description: The Location header contains the URL where the status of the long running operation can be checked.
              schema:
                type: string
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Media
      security:
        - BearerAuth: []
  /media/photo/{organizationId}/{photoId}:
    get:
      operationId: getMediaPhoto
      description: Get photo media (redirects to S3 presigned URL)
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.OrganizationID'
        - name: photoId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '307':
          description: The URL of the requested resource has been changed temporarily.
          headers:
            location:
              required: true
              description: The Location header contains the URL where the status of the long running operation can be checked.
              schema:
                type: string
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Media
      security:
        - BearerAuth: []
components:
  parameters:
    Common.Pagination.PageParams.cursor:
      name: cursor
      in: query
      required: false
      description: Token to retrieve items after a specific point
      schema:
        type: string
      explode: false
    Common.Pagination.PageParams.limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (server may return fewer)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      explode: false
    Common.Types.GridRectQuery.xmax:
      name: xmax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.xmin:
      name: xmin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymax:
      name: ymax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymin:
      name: ymin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.HRangeQuery.hmax:
      name: hmax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.HRangeQuery.hmin:
      name: hmin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.TimeRangeQuery.from:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Common.Types.TimeRangeQuery.to:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    Models.ListPanoramaRequest.baseX:
      name: baseX
      in: query
      required: false
      description: The base X grid coordinate
      schema:
        type: integer
        format: int32
      explode: false
    Models.ListPanoramaRequest.baseY:
      name: baseY
      in: query
      required: false
