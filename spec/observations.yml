    Models.CreateTileUploadLink:
      type: object
      required:
        - capturedAt
      properties:
        capturedAt:
          type: string
          format: date-time
          description: When the panorama was captured (used for S3 path organization)
      description: Request to create upload link for a panorama tile
    Models.CreateUploadLink:
      type: object
      required:
        - capturedAt
      properties:
