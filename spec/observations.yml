      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - AuthenticationRequired
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ConflictError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Conflict
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the resource already exists or conflicts with the current state
    Common.Errors.ForbiddenError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - Forbidden
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - InternalServerError
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Errors.NotFoundError:
      type: object
      required:
        - code
        - resource_id
      properties:
        code:
          type: string
          enum:
            - NotFound
        resource_id:
          type: string
          description: Identifier of the resource that was not found
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the requested resource was not found
    Common.Errors.ValidationError:
      type: object
      required:
        - code
        - details
      properties:
        code:
          type: string
          enum:
            - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
              - field
              - issue
      allOf:
        - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the request was invalid
    Common.Types.GridPos:
      type: object
      required:
        - x
        - 'y'
        - h
      properties:
        x:
          type: number
          format: double
        'y':
          type: number
          format: double
        h:
          type: number
          format: double
      description: Position in 3D grid space within the greenhouse
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Common.Types.OrganizationID:
      type: string
      description: Organization identifier (opaque string)
    Common.Types.UserID:
      type: string
      description: User identifier (opaque string)
    CreateOrUpdatePhoto:
      type: object
      required:
        - id
        - greenhouseId
        - cultureId
        - growingCycleId
        - capturedAt
        - source
        - pos
        - ptz
      properties:
        id:
          $ref: '#/components/schemas/Common.Types.ID'
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cultureId:
          type: string
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        capturedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/Models.PhotoSource'
        s3Key:
          type: string
          description: S3 key for the photo. Auto-generated if not provided. Use for migrating existing photos.
        pos:
          allOf:
            - $ref: '#/components/schemas/Common.Types.GridPos'
          description: Position of the object on photo on the grid (XYH)
        deviceId:
          $ref: '#/components/schemas/Common.Types.ID'
        deviceType:
          allOf:
            - $ref: '#/components/schemas/Devices.Models.DeviceType'
          description: Type of the device. Optional - defaults to 'unknown' if not provided.
        zoneObjectId:
          $ref: '#/components/schemas/Common.Types.ID'
        pipelineId:
          $ref: '#/components/schemas/Common.Types.ID'
        metadata:
          type: object
          additionalProperties: {}
          description: Additional metadata (resolution, format, etc.)
        ptz:
          type: array
          items:
            type: number
            format: double
          description: 'Camera pan/tilt/zoom settings. Array of 3 elements: [pan (radians, -π to π), tilt (radians, 0 to π/2), zoom (level)]'
      description: ''
    Devices.Models.DeviceType:
      type: string
      enum:
        - camera
        - router
        - unknown
      description: Device type
    Models.CreatePanoramaUploadLink:
      type: object
      required:
        - capturedAt
