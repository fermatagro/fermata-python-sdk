          format: date-time
          description: When the photo was captured (used for S3 path organization)
      description: Request to create upload link for a photo
    Models.CutPanoramaRequest:
      type: object
      required:
        - panoramaId
      properties:
        panoramaId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: ID of the existing panorama to cut into tiles
      description: Request to submit a cut-only tile generation job for an existing panorama
    Models.CutPanoramaResponse:
      type: object
      required:
        - jobId
      properties:
        jobId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: The ID of the created cut job (use stitcher API to poll status)
      description: Response for cut panorama submission
    Models.DownloadLinkResponse:
      type: object
      required:
        - downloadUrl
        - expiresAt
      properties:
        downloadUrl:
          type: string
          description: Presigned S3 URL for download
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL expires
      description: Response with presigned download URL
    Models.GetRawCaptureUploadLinkRequest:
      type: object
      required:
        - fireId
        - deviceId
        - level
        - index
      properties:
        fireId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Prefect fire ID (groups all captures for a greenhouse run)
        deviceId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: The ID of the device that will capture the image
        level:
          type: integer
          format: int32
          minimum: 0
          maximum: 7
          description: Tilt level (0-7)
        index:
          type: integer
          format: int32
          minimum: 0
          description: Pan index within level (0 to 16-level*2-1)
