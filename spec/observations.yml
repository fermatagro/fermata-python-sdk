openapi: 3.0.0
info:
  title: Demetra Observations API
  version: 1.3.0
tags:
- name: PhotosAPI
- name: PanoramasAPI
- name: AttachmentsAPI
- name: MediaStaticAPI
- name: MediaThumbAPI
paths:
  /api/v1/photos/{photoId}:
    post:
      operationId: createPhoto
      description: Create photo metadata after S3 upload
      parameters:
      - name: photoId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created
            as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ConflictError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - PhotosAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CreateOrUpdatePhoto'
      security:
      - BearerAuth: []
  /api/v1/photos/{photoId}/upload-link:
    post:
      operationId: createPhotoUploadLink
      description: Get a presigned URL for direct S3 upload
      parameters:
      - name: photoId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.UploadLinkResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ConflictError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
      - PhotosAPI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Models.CreateUploadLink'
      security:
      - BearerAuth: []
components:
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
      - request_id
      - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
      description: All error responses share these common fields
    Common.Errors.AuthenticationError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - AuthenticationRequired
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that authentication is required to access the resource
    Common.Errors.ConflictError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - Conflict
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that the resource already exists or conflicts with the
        current state
    Common.Errors.ForbiddenError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - Forbidden
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that action is forbidden due to lack of permissions
    Common.Errors.InternalServerError:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - InternalServerError
      allOf:
      - $ref: '#/components/schemas/Common.Errors.ApiError'
      description: Indicates that an internal server error occurred
    Common.Types.GridPos:
      type: object
      required:
      - x
      - y
      - h
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        h:
          type: number
          format: double
      description: Position in 3D grid space within the greenhouse
    Common.Types.ID:
      type: string
      format: uuid
      description: UUID identifier
    Devices.Models.DeviceType:
      type: string
      enum:
      - camera
      - router
      description: Device type
    Models.CreateOrUpdatePhoto:
      type: object
      required:
      - id
      - greenhouseId
      - cultureId
      - growingCycleId
      - capturedAt
      - source
      - pos
      - ptz
      properties:
        id:
          $ref: '#/components/schemas/Common.Types.ID'
        greenhouseId:
          $ref: '#/components/schemas/Common.Types.ID'
        cultureId:
          type: string
        growingCycleId:
          $ref: '#/components/schemas/Common.Types.ID'
        capturedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/Models.PhotoSource'
        s3Key:
          type: string
          description: S3 key for the photo. Auto-generated if not provided. Use for
            migrating existing photos.
        pos:
          allOf:
          - $ref: '#/components/schemas/Common.Types.GridPos'
          description: Position of the object on photo on the grid (XYH)
        deviceId:
          $ref: '#/components/schemas/Common.Types.ID'
        deviceType:
          allOf:
          - $ref: '#/components/schemas/Devices.Models.DeviceType'
          description: Type of the device. Optional - defaults to 'unknown' if not
            provided.
        zoneObjectId:
          $ref: '#/components/schemas/Common.Types.ID'
        pipelineId:
          $ref: '#/components/schemas/Common.Types.ID'
        metadata:
          type: object
          additionalProperties: {}
          description: Additional metadata (resolution, format, etc.)
        ptz:
          type: array
          items:
            type: number
            format: double
          description: 'Camera pan/tilt/zoom settings. Array of 3 elements: [pan (radians,
            -π to π), tilt (radians, 0 to π/2), zoom (level)]'
        camPos:
          type: array
          items:
            type: number
            format: double
          description: Camera position as [x, y, z] coordinates
      description: A photograph captured in the greenhouse
    Models.CreateUploadLink:
      type: object
      required:
      - capturedAt
      properties:
        capturedAt:
          type: string
          format: date-time
          description: When the photo was captured (used for S3 path organization)
      description: Request to create upload link for a photo
    Models.PhotoSource:
      type: string
      enum:
      - human
      - pipeline
      description: Source of the photo capture
    Models.UploadLinkResponse:
      type: object
      required:
      - photoId
      - uploadUrl
      - downloadUrl
      - deleteUrl
      - expiresAt
      properties:
        photoId:
          allOf:
          - $ref: '#/components/schemas/Common.Types.ID'
          description: ID assigned to the photo being uploaded
        uploadUrl:
          type: string
          description: Presigned S3 URL for direct upload (PUT)
        downloadUrl:
          type: string
          description: Presigned S3 URL for direct download (GET) - use for preview
            before metadata is created
        deleteUrl:
          type: string
          description: Presigned S3 URL for direct delete (DELETE) - use to cleanup
            orphan files on retake/cancel
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL expires
      description: Response with presigned upload URL
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
