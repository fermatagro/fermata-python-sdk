    Models.GetRawCaptureUploadLinkResponse:
      type: object
      required:
        - uploadUrl
        - expiresAt
      properties:
        uploadUrl:
          type: string
          description: Presigned S3 URL for direct upload
        expiresAt:
          type: string
          format: date-time
          description: When the presigned URL expires
      description: Response with single presigned upload URL for raw capture
    Models.GetStitchDownloadLinksRequest:
      type: object
      required:
        - fireId
        - deviceId
      properties:
        fireId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Prefect fire ID (groups all captures for a greenhouse run)
        deviceId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: The ID of the device that captured the images
      description: Request for download links for all raw panorama input images
    Models.GetStitchDownloadLinksResponse:
      type: object
      required:
