          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Device Placements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pan:
                  type: number
                  format: double
                  description: Pan angle in radians (-π to π)
                tilt:
                  type: number
                  format: double
                  description: Tilt angle in radians (0 to π/2)
                planeH:
                  type: number
                  format: double
                  description: Height of the target plane (must be non-negative)
              required:
                - pan
                - tilt
                - planeH
      security:
        - BearerAuth: []
