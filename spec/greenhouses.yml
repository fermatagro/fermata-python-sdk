            schema:
              type: object
              properties:
                pos:
                  $ref: '#/components/schemas/Common.Types.FlatGridPos'
                height:
                  type: number
                  format: double
                orientationVector:
                  $ref: '#/components/schemas/Common.Types.OrientationVector'
                conversionMatrix:
                  type: array
                  items:
                    type: number
                    format: double
                  description: 3x3 rotation matrix (row-major, 9 elements) for camera coordinate conversion
              required:
                - pos
                - height
      security:
        - BearerAuth: []
    get:
