          description: Status of the zone object
      description: ''
    Devices.Models.DeviceType:
      type: string
      enum:
        - camera
        - router
        - unknown
      description: Device type
    Models.DeviceInGreenhouse:
      type: object
      required:
        - deviceId
        - greenhouseId
        - deviceType
        - pos
        - height
        - createdAt
        - updatedAt
      properties:
        deviceId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        greenhouseId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        deviceType:
          allOf:
            - $ref: '#/components/schemas/Devices.Models.DeviceType'
          description: Type of the device (denormalized from Devices context)
          readOnly: true
        pos:
          $ref: '#/components/schemas/Common.Types.FlatGridPos'
        height:
          type: number
          format: double
        orientationVector:
          $ref: '#/components/schemas/Common.Types.OrientationVector'
        conversionMatrix:
          type: array
          items:
            type: number
            format: double
          minItems: 9
          maxItems: 9
          description: 3x3 rotation matrix (row-major, 9 elements) for converting between camera and world coordinates
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        coverageRadius:
          type: number
          format: double
          description: Maximum Euclidean distance from camera to its Zone Objects. Only for cameras with ZOs.
          readOnly: true
      description: Device placement within a greenhouse
    Models.Greenhouse:
      type: object
      required:
        - id
        - organizationId
        - description
        - width
        - height
        - tz
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Unique identifier
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization that owns this greenhouse
          readOnly: true
        description:
          type: string
          description: Human-readable name/description
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        tz:
          type: string
          description: IANA timezone identifier (e.g., 'Europe/Moscow')
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: A greenhouse structure within an organization
    Models.GreenhouseObject:
      type: object
      required:
        - id
        - greenhouseId
        - kind
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        greenhouseId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        kind:
          $ref: '#/components/schemas/Models.GreenhouseObjectType'
        description:
          type: string
        pos:
          $ref: '#/components/schemas/Common.Types.FlatGridPos'
        height:
          type: number
          format: double
        rect:
          $ref: '#/components/schemas/Common.Types.GridRect'
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: Physical object (row, block) within a greenhouse
    Models.GreenhouseObjectType:
      type: string
      enum:
        - row
        - block
        - exit
      description: Type of object within a greenhouse
    Models.PanTilt:
      type: object
      required:
        - pan
        - tilt
      properties:
        pan:
          type: number
          format: double
          description: Pan angle in radians
        tilt:
          type: number
          format: double
          description: Tilt angle in radians
      description: Pan-Tilt result from world coordinate transformation
    Models.ZoneObject:
      type: object
      required:
        - id
        - organizationId
        - greenhouseId
        - pos
        - height
        - ptz
        - deviceId
        - deviceType
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          readOnly: true
        organizationId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.OrganizationID'
          description: Organization that owns this zone object
        greenhouseId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Greenhouse that contains this zone object
        pos:
          allOf:
            - $ref: '#/components/schemas/Common.Types.FlatGridPos'
          description: Grid position of the zone object within the greenhouse
        height:
          type: number
          format: double
          description: Height above the grid for this zone object
        ptz:
          allOf:
            - $ref: '#/components/schemas/Common.Types.PTZ'
          description: Pan-Tilt-Zoom camera position for this zone object
        deviceId:
          allOf:
            - $ref: '#/components/schemas/Common.Types.ID'
          description: Device assigned to this zone object
        deviceType:
          allOf:
            - $ref: '#/components/schemas/Devices.Models.DeviceType'
          description: Type of the device (denormalized from Devices context)
          readOnly: true
        status:
          allOf:
            - $ref: '#/components/schemas/Models.ZoneObjectStatus'
          description: Status of the zone object
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      description: Predefined observation zone/point in the greenhouse (camera PTZ position)
    Models.ZoneObjectBatchError:
      type: object
      required:
        - code
        - details
        - request_id
        - message
        - index
      properties:
        code:
          type: string
          enum:
            - ValidationError
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
            required:
              - field
              - issue
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
          description: Human-readable message describing the error
        index:
          type: integer
          format: int32
          readOnly: true
    Models.ZoneObjectStatus:
      type: string
      enum:
        - active
        - inactive
        - maintenance
      description: Status of a zone object
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
