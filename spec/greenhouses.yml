      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymax:
      name: ymax
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
    Common.Types.GridRectQuery.ymin:
      name: ymin
      in: query
      required: false
      schema:
        type: number
        format: double
      explode: false
  schemas:
    Common.Errors.ApiError:
      type: object
      required:
        - request_id
        - message
      properties:
        request_id:
          type: string
          description: Unique identifier for the request, useful for debugging
        message:
          type: string
