  /api/v1/greenhouses/{greenhouseId}/devices/{deviceId}/transform-to-world:
    post:
      operationId: transformToWorld
      description: Convert camera Pan-Tilt angles to world XYH coordinates using the device's conversion matrix
      parameters:
        - name: greenhouseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
        - name: deviceId
          in: path
          required: true
