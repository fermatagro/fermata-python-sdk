openapi: 3.0.0
info:
  title: Demetra GreenhouseCore API
  version: 0.0.0
tags:
  - name: Greenhouses
  - name: Greenhouse Objects
  - name: Device Placements
  - name: Zone Objects
paths:
  /api/v1/greenhouses:
    get:
      operationId: listGreenhouses
      description: List all greenhouses in the organization
      parameters:
        - $ref: '#/components/parameters/Common.Pagination.PageParams.cursor'
        - $ref: '#/components/parameters/Common.Pagination.PageParams.limit'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Models.Greenhouse'
                    description: Items for the current page
                  next_token:
                    type: string
                    description: Token to retrieve the next page of items, if any
                description: Generic paginated response model with cursor-based pagination
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Greenhouses
      security:
        - BearerAuth: []
  /api/v1/greenhouses/{greenhouseId}:
    post:
      operationId: createGreenhouse
      description: Create a new greenhouse
      parameters:
        - name: greenhouseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Greenhouses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateGreenhouse'
      security:
        - BearerAuth: []
    get:
      operationId: getGreenhouse
      description: Get greenhouse by ID
      parameters:
        - name: greenhouseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Models.Greenhouse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.ForbiddenError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.InternalServerError'
      tags:
        - Greenhouses
      security:
        - BearerAuth: []
    delete:
      operationId: deleteGreenhouse
      description: Delete a greenhouse (soft delete)
      parameters:
        - name: greenhouseId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Common.Types.ID'
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.Errors.AuthenticationError'
        '403':
